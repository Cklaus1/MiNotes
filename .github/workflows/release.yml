# Desktop release builds: pushing a tag `v*` (or running this workflow by hand with
# a tag) builds the Windows installers (NSIS setup.exe + .msi) and the Linux
# packages (.AppImage, .deb, .rpm), plus the plain `minotes` CLI binary per OS, and
# attaches them to a DRAFT GitHub Release. Nothing is published: the owner reviews
# the draft and presses "Publish" by hand.
#
# The installers are UNSIGNED. Until a code-signing certificate is added, Windows
# SmartScreen shows "Windows protected your PC" (More info -> Run anyway) and the
# publisher reads "Unknown publisher". To sign later: add the certificate as
# repository secrets and pass them to the tauri-action step below (Tauri's
# `bundle.windows.certificateThumbprint` / `signCommand` in tauri.conf.json, with the
# certificate imported in an extra step before the build); the signing step is
# the only place secrets would be needed. This workflow uses only the built-in
# GITHUB_TOKEN.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update as a draft, e.g. v0.1.0 (built from the selected branch)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: ${{ matrix.name }}
    # contents: write is what lets tauri-action create the draft release.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (NSIS + MSI)
            os: windows-latest
            bundles: nsis,msi
            cli: minotes-windows-x86_64.exe
            cli_src: target/release/minotes.exe
            cache: release-windows
          - name: Linux (AppImage + deb + rpm)
            # Oldest runner image still offered: AppImage/deb link against its glibc,
            # so the packages run on older distributions too.
            os: ubuntu-22.04
            bundles: appimage,deb,rpm
            cli: minotes-linux-x86_64
            cli_src: target/release/minotes
            cache: release-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$RELEASE_TAG' is not a release tag like v1.2.3"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build libraries (Linux)
        if: runner.os == 'Linux'
        # Tauri 2 needs WebKitGTK 4.1 + libsoup 3 (same set as ci.yml); libssl-dev
        # builds nothing here (SQLCipher's OpenSSL is vendored) but keeps parity.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config file patchelf libssl-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev \
            xdg-utils

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.cache }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/minotes-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: crates/minotes-app
        run: npm ci

      - name: Build the installers and create the draft release
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/minotes-app
          tagName: ${{ env.RELEASE_TAG }}
          releaseCommitish: ${{ github.sha }}
          releaseName: "MiNotes v__VERSION__"
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
          releaseBody: |
            ## Install

            **Windows** — download `MiNotes_*_x64-setup.exe` and run it (installs for the current user, no admin prompt; WebView2 is downloaded if missing). Or use the `.msi`.
            The installer is not code-signed yet, so SmartScreen may say "Windows protected your PC": click **More info**, then **Run anyway**.

            **Linux**
            - AppImage: `chmod +x MiNotes_*.AppImage && ./MiNotes_*.AppImage`
            - Debian / Ubuntu: `sudo apt install ./MiNotes_*.deb`
            - Fedora / RHEL: `sudo dnf install ./MiNotes-*.rpm`

            **Android (test build)** — `MiNotes_*_android-debug.apk` (attached by the Android workflow a little later): allow "install unknown apps" for your browser or file manager, then open it. A debug build for trying out, not a Play Store release.

            **Command line** — `minotes-windows-x86_64.exe` / `minotes-linux-x86_64` is the standalone `minotes` CLI (same notebooks as the app).

            What changed: see the [CHANGELOG](https://github.com/${{ github.repository }}/blob/${{ env.RELEASE_TAG }}/CHANGELOG.md).

      - name: Build the minotes CLI
        run: cargo build --release --locked -p minotes-cli

      - name: Attach the CLI to the draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_URL: ${{ steps.tauri.outputs.releaseUploadUrl }}
          CLI_NAME: ${{ matrix.cli }}
          CLI_SRC: ${{ matrix.cli_src }}
        run: |
          # releaseUploadUrl ends in a "{?name,label}" template; the draft is not
          # addressable by tag with `gh release upload`, but its upload URL is.
          url="${UPLOAD_URL%%\{*}"
          cp "$CLI_SRC" "$CLI_NAME"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$CLI_NAME" \
            "$url?name=$CLI_NAME"
