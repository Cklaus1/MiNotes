[package]
name = "minotes-core"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
hostname = "0.4"
sha2 = "0.10"
# AI platform: blocking HTTP client for the OpenAI-compatible providers (OpenRouter / local).
ureq = "3"
# ── Import / attachments ──
quick-xml = "0.39"
base64 = "0.22"
md-5 = "0.10"
# Notebook zip export / import (pure-Rust deflate: builds for Android too).
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# ── End import ──

[dev-dependencies]
tempfile = "3"
